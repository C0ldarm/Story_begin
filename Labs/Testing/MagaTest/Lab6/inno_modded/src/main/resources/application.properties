spring.application.name=inno

spring.mongodb.host=localhost
spring.mongodb.port=27017
spring.mongodb.database=inno

# --- JaVers (аудит) ---
# Порівнюємо поля, а не геттери
javers.mappingStyle=FIELD
# Пакет з аудованими сутностями (потрібен для @TypeName)
javers.packagesToScan=chnu.edu.inno.model
# Зручний для читання JSON у відповідях аудиту
javers.prettyPrint=true
